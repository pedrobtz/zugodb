# The native checks for the vendored engine and the glue: sanitizers (UBSan,
# and ASan in the R-hub containers), valgrind, LTO, rchk, the compilers'
# analysers and cran-special. gctorture has its own caller, gctorture.yaml.
on:
  # No `push:`. A pull request already checks its merge with main, so the
  # push after merge would check the same tree again, in every package at
  # once. Main is checked by the schedule below, which skips a commit it has
  # already checked (r-actions README, "Pushes to main").
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Weekly in this package's slot (Saturday 07:00 UTC), and on demand:
  # `gh workflow run native-checks.yaml --ref main`.
  schedule:
    - cron: "28 7 * * 6"
  workflow_dispatch:

name: native-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# `profile` goes to the three workflows it changes: quick skips the asan
# containers, valgrind and cran-special. lto, rchk and analyzers take minutes
# either way and run on every push. Each job is decided without a runner
# (ci.md, Labels); the gate inside repeats it.
jobs:
  sanitizers:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:native-checks'))
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: auto
      # The engine is about four CPU-minutes to compile; the runners have
      # four cores. Without this, every check waits on a serial build.
      env: |
        MAKEFLAGS=-j4

  valgrind:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:native-checks'))
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: auto
      # Only cli's thread TLS in a forked child (r-actions#131); each entry
      # there says why and which issue removes it.
      suppressions: tools/ci/valgrind.supp

  lto:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:native-checks'))
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  rchk:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:native-checks'))
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1

  analyzers:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:native-checks'))
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1

  cran-special:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:native-checks'))
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: auto
