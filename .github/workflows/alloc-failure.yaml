# Fails each allocation of tools/alloc-exercise.R in turn, above the floor
# of loading the package, and checks the run ends in an error the package
# raised, not a crash. Scheduled and on demand: it restarts R once per
# allocation (r-actions README, "alloc-failure.yml").
on:
  schedule:
    - cron: "48 7 * * 6"
  workflow_dispatch:

name: alloc-failure

jobs:
  alloc-failure:
    uses: pedrobtz/r-actions/.github/workflows/alloc-failure.yml@v1
    with:
      run: R_ENABLE_JIT=0 Rscript tools/alloc-exercise.R
      baseline-run: R_ENABLE_JIT=0 Rscript -e 'suppressPackageStartupMessages(library(zuslothdb))'
      expect-pattern: "cannot allocate|memory exhausted|bad_alloc|out of memory"
      # The glue's own catch of a failed engine allocation.
      target-pattern: "bad_alloc|out of memory"
      min-target-hits: 1
      max-allocations: 400
      ignore-crash-pattern: "^ 1: (grepl?|sub|gsub|strsplit|gzfile)\\("
