# The vendored engine is libzugodb at the release tools/vendor.yaml pins,
# and nothing else: tools/vendor/verify rebuilds it, checks that the tag is
# the pinned commit and descends from SlothDB's, and compares every file. On pull requests, a change under
# src/vendor must come with a change to the manifest and to the checksums.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "38 7 * * 6"
  workflow_dispatch:

name: vendor

permissions:
  contents: read

jobs:
  vendor:
    # Decided without a runner (ci.md, Labels).
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:vendor'))
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      vendor-dir: src/vendor
      verify: tools/vendor/verify
      must-update: |
        tools/vendor.yaml
        tools/vendor/checksums.md5
