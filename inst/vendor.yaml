# What zuslothdb vendors: a tagged release of libzugodb, its engine.
#
# libzugodb (design D12, 2026-11-18) is the engine's own repository: SlothDB
# at `origin.commit`, by the SlothDB Contributors, MIT, with the changes in
# its CHANGELOG.md. tools/vendor.R checks out `source.tag`, checks that it
# is `source.commit` and that `origin.commit` is an ancestor, copies `copy`
# minus `exclude` into `destination`, and writes src/Makevars,
# src/Makevars.win, src/sdb_provenance.h, inst/vendor.yaml and
# tools/vendor/checksums.md5. Nothing under `destination` is edited by
# hand: a change to the engine is a pull request to libzugodb and a release.
#
# tools/upstream-tests.sh builds libzugodb's doctest suite, at the same
# commit, against the vendored tree.

source:
  repository: https://github.com/pedrobtz/libzugodb
  tag: v0.1.1
  commit: d3ec8c5ff1818c5079ecac0185514656fb715e66

origin:
  repository: https://github.com/SouravRoy-ETL/slothdb
  commit: 8180f215847015944c935f56f008d194e2c1494c
  # The last SlothDB release before that commit.
  describe: v0.2.7+
  license: MIT

destination: src/vendor/libzugodb

copy:
  - LICENSE
  - include
  - src
  - third_party/zstd/LICENSE
  - third_party/zstd/lib/zstd.h
  - third_party/zstd/lib/zstd_errors.h
  - third_party/zstd/lib/common
  - third_party/zstd/lib/decompress
  - third_party/fastpforlib
  - third_party/snappy

exclude:
  - path: src/api
    reason: >-
      SlothDB's C API, for its Python binding; the glue binds the C++ API
      (design D2). Its slothdb_api.cpp also raises a
      -Wreturn-type-c-linkage warning, which R CMD check counts.
  - path: include/slothdb/api
    reason: Header of src/api.
  - path: src/CMakeLists.txt
    reason: The package builds from src/Makevars, written by tools/vendor.R.
  - path: third_party/zstd/lib/decompress/huf_decompress_amd64.S
    reason: >-
      Assembly; ZSTD_DISABLE_ASM selects the C path, as upstream's CMake
      build does.
  - path: third_party/snappy/snappy-stubs-public.h.in
    reason: CMake template; snappy-stubs-public.h is already generated.
  - path: third_party/snappy/README.md
    reason: Not source.
  - path: third_party/snappy/config.h
    reason: Unused; nothing defines HAVE_CONFIG_H, as upstream's build does not.
